# dsh-artifacts bundle patch: inserts the plugin row into the profile roster.
#
# The entry name is the BARE package name on purpose: the client-module scanner
# treats it as a package specifier, so a subpath entry would be cached as
# "not a client package" and the browser half would silently never load.
#
# The artifacts root is configurable, in order:
#   1. the panel's ⚙ settings dialog (persists through the config editor
#      into the user's patch layer below),
#   2. the `DSH_ARTIFACTS_ROOT` environment variable,
#   3. the per-user default `~/.dsh/artifacts` (created on first run).
# To set it by hand instead, add a row to YOUR patch layer (it overrides this
# bundle's row by id):
#
# - id: dsh-artifacts
#   config:
#     root: 'D:\some\folder'
- insert:
    - id: dsh-artifacts
      name: 'dsh-artifacts'
